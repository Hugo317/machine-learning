[project]
name = "machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hugo Caravlho", email = "hugomnc317@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "holidays>=0.105",
    "holy>=0.0.2",
    "pandas>=3.0.6",
    "pycountry>=26.2.16",
    "pycountry-convert>=0.7.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
]

[project.scripts]
machine-learning = "machine_learning:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
